<!doctype html>
<html>
<head><meta charset="utf-8"><title>Thinking</title>
<style>
  body { margin: 0; background: var(--bg-000); color: var(--ink-100); font-family: var(--font-sans); }
  .wrap { padding: 20px 24px; display: grid; gap: 16px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var Z = window.Bezpiecznik, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'wrap' },
      h(Z.Thinking, { label: 'Szukam w Poradniku bezpieczeństwa…' }),
      h(Z.Thinking, { label: null })
    )
  );
</script>
</body>
</html>
