<!-- @dsCard group="Actions" height=300 subtitle="Pigułki i koła w stylu ChatGPT" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button — preview</title>
<style>
  body { margin: 0; background: var(--bg-000); color: var(--ink-100); font-family: var(--font-sans); }
  .wrap { padding: 20px 24px; display: grid; gap: 16px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .lbl { width: 92px; font-size: 12px; line-height: 16px; color: var(--ink-300); }
  .composer { display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: var(--radius-full); background: var(--bg-200); width: 420px; }
  .composer span { flex: 1; color: var(--ink-300); font-size: 15px; padding: 0 6px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var B = window.Bezpiecznik.Button, h = React.createElement;
  function I(paths) {
    return h('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round', 'aria-hidden': 'true' },
      paths.map(function (d, i) { return h('path', { key: i, d: d }); }));
  }
  var up = function () { return I(['m5 12 7-7 7 7', 'M12 19V5']); };
  var plus = function () { return I(['M5 12h14', 'M12 5v14']); };
  var mic = function () { return I(['M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z', 'M19 10v2a7 7 0 0 1-14 0v-2', 'M12 19v3']); };
  var share = function () { return I(['M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8', 'm16 6-4-4-4 4', 'M12 2v13']); };
  var nav = function () { return I(['M3 11 22 2l-9 19-2-8-8-2Z']); };
  var phone = function () { return I(['M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z']); };
  var more = function () { return I(['M5 12h.01', 'M12 12h.01', 'M19 12h.01']); };
  var copy = function () { return I(['M8 8h12v12H8z', 'M4 16V4h12']); };

  function Row(label) {
    var kids = Array.prototype.slice.call(arguments, 1);
    return h('div', { className: 'row' }, h('div', { className: 'lbl' }, label), kids);
  }

  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'wrap' },
      Row('Warianty',
        h(B, { variant: 'primary', icon: h(nav) }, 'Prowadź do schronu'),
        h(B, { icon: h(share) }, 'Udostępnij'),
        h(B, { variant: 'ghost' }, 'Pomiń'),
        h(B, { variant: 'sos', icon: h(phone) }, 'Zadzwoń 112')
      ),
      Row('Composer',
        h('div', { className: 'composer' },
          h(B, { variant: 'ghost', icon: h(plus), 'aria-label': 'Dodaj' }),
          h('span', null, 'Zapytaj, co zrobić…'),
          h(B, { variant: 'ghost', icon: h(mic), 'aria-label': 'Dyktuj' }),
          h(B, { variant: 'primary', icon: h(up), 'aria-label': 'Wyślij' })
        ),
        h(B, { variant: 'primary', icon: h(up), 'aria-label': 'Wyślij (puste pole)', disabled: true })
      ),
      Row('Pod odpowiedzią',
        h(B, { variant: 'ghost', size: 'sm', icon: h(copy), 'aria-label': 'Kopiuj' }),
        h(B, { variant: 'ghost', size: 'sm', icon: h(share), 'aria-label': 'Udostępnij' }),
        h(B, { variant: 'ghost', size: 'sm', icon: h(more), 'aria-label': 'Więcej' }),
        h(B, { size: 'sm' }, 'Jak zrobić RKO dziecku?'),
        h(B, { size: 'sm' }, 'Co spakować na 72h?')
      ),
      Row('Rozmiary',
        h(B, { size: 'sm' }, 'Mały 32'),
        h(B, null, 'Średni 36'),
        h(B, { size: 'lg' }, 'Duży 44'),
        h(B, { size: 'lg', variant: 'primary', icon: h(up), 'aria-label': 'Wyślij' })
      ),
      Row('Stany',
        h(B, { variant: 'primary', loading: true }, 'Szukam w poradniku…'),
        h(B, { disabled: true }, 'Niedostępne'),
        h(B, { variant: 'sos', size: 'lg', icon: h(phone) }, 'Zadzwoń 112')
      )
    )
  );
</script>
</body>
</html>
