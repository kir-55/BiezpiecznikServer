<!doctype html>
<html>
<head><meta charset="utf-8"><title>Composer</title>
<style>
  body { margin: 0; background: var(--bg-000); color: var(--ink-100); font-family: var(--font-sans); }
  .wrap { padding: 20px 24px; display: grid; gap: 16px; max-width: 640px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var Z = window.Bezpiecznik, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'wrap' },
      h(Z.Composer, { onAttach: function () {}, onVoice: function () {}, placeholder: 'Zapytaj, co zrobić…' }),
      h(Z.Composer, { defaultValue: 'Prąd wysiadł, mam niemowlę i leki w lodówce. Co robić?', onAttach: function () {}, onVoice: function () {} }),
      h(Z.Composer, { defaultValue: 'Gdzie najbliższy schron?', busy: true, onVoice: function () {} })
    )
  );
</script>
</body>
</html>
