<html>
<head><meta charset="utf-8"><title>OfflineBadge</title>

<script>
  var Z = window.Bezpiecznik, h = React.createElement;

      h(Z.OfflineBadge),
      h(Z.OfflineBadge, { mode: 'airplane' }),
      h(Z.OfflineBadge, null, 'Offline · baza z 12.11')

  );
