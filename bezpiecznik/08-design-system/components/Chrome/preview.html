<!doctype html>
<html>
<head><meta charset="utf-8"><title>Chrome</title>
<style>
  body { margin: 0; background: var(--bg-000); color: var(--ink-100); font-family: var(--font-sans); }
  .wrap { padding: 20px 24px; display: grid; gap: 20px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .col { display: grid; gap: 12px; align-content: start; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; align-items: start; }
  .lbl { font-size: 12px; line-height: 16px; color: var(--ink-300); }
  .w360 { max-width: 360px; } .w420 { max-width: 420px; }

</style>
</head>
<body>
<div id="root"></div>
<script>
  var Z = window.Bezpiecznik, h = React.createElement, I = function (n, s) { return h(Z.Icon, { name: n, size: s }); };
  var noop = function () {};
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'wrap' },
      h('div', { className: 'row', style: { justifyContent: 'space-between', maxWidth: 420, padding: 12, borderRadius: 24, background: 'var(--bg-100)' } },
        h(Z.NavIsland, { onMenu: noop, onMap: noop }), h(Z.SosButton, { onPress: noop, onHold: noop })),
      h('div', { className: 'row', style: { gap: 16 } },
        h(Z.FloatingButton, { onClick: noop }), h(Z.FloatingButton, { kind: 'close', onClick: noop }), h(Z.FloatingButton, { kind: 'locate', active: true, onClick: noop }),
        h(Z.CprIndicator, { time: '3:42', rate: 110, onClick: noop })),
      h('div', { className: 'lbl' }, 'Przytrzymaj SOS — obwódka wypełnia się przez 800 ms, potem tel:112. Dotknięcie otwiera panel Kontakt ze służbami.'))
  );
</script>
</body>
</html>
