<!doctype html>
<html>
<head><meta charset="utf-8"><title>SourceChip</title>
<style>
  body { margin: 0; background: var(--bg-000); color: var(--ink-100); font-family: var(--font-sans); }
  .wrap { padding: 20px 24px; display: grid; gap: 16px;  }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var Z = window.Bezpiecznik, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'wrap' }, h('div', { className: 'row' },
      h(Z.SourceChip, { source: 'RCB', title: 'Poradnik bezpieczeństwa', page: 34, onClick: function () {} }),
      h(Z.SourceChip, { source: 'PSP', page: 7, onClick: function () {} }),
      h(Z.SourceChip, { source: 'Akademia Pożarnicza', title: 'Nim nadejdzie dzień', page: 12 })
    ))
  );
</script>
</body>
</html>
